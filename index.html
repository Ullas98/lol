<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Token Manager</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#050505;
color:white;
padding:16px;
}

h1{
text-align:center;
font-size:22px;
margin-bottom:18px;
color:#00eaff;
text-shadow:0 0 15px #00eaff66;
}

textarea{
width:100%;
height:110px;
border-radius:14px;
border:1px solid #00eaff33;
background:#111;
color:white;
padding:14px;
font-size:14px;
outline:none;
box-shadow:0 0 15px #00eaff22 inset;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#00eaff;
color:black;
font-weight:600;
font-size:15px;
box-shadow:0 0 15px #00eaff;
margin-bottom:20px;
transition:.2s;
}

button:active{
transform:scale(.97);
}

.section{
margin-bottom:25px;
}

.section h2{
font-size:16px;
margin-bottom:8px;
color:#00eaff;
}

.counter{
font-size:12px;
opacity:.6;
margin-bottom:6px;
}

.token{
background:#101010;
border:1px solid #00eaff33;
border-radius:12px;
padding:12px;
margin-bottom:8px;
font-size:13px;
word-break:break-all;
cursor:pointer;
transition:all .3s ease;
}

.token:hover{
box-shadow:0 0 12px #00eaff44;
}

.token.done{
border:1px solid #00ff9c55;
box-shadow:0 0 10px #00ff9c33;
}

.copyBox{
background:#101010;
border:1px solid #00eaff33;
border-radius:12px;
padding:14px;
margin-bottom:12px;
font-size:13px;
cursor:pointer;
white-space:pre-line;
transition:.3s;
}

.copyBox:hover{
box-shadow:0 0 12px #00eaff44;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(6px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style></head><body><h1>Token Manager</h1><!-- TEXT BOX 1 --><div class="section">
<h2>Text Box 1</h2>
<div id="box1" class="copyBox"></div>
</div><!-- TEXT BOX 2 --><div class="section">
<h2>Text Box 2</h2>
<div id="box2" class="copyBox"></div>
</div><textarea id="input" placeholder="paste tokens (one per line)"></textarea><button onclick="addTokens()">Add Tokens</button>

<div class="section">
<h2>Available Tokens</h2>
<div class="counter" id="availableCount">0 tokens</div>
<div id="tokens"></div>
</div><div class="section">
<h2>Done</h2>
<div class="counter" id="doneCount">0 tokens</div>
<div id="done"></div>
</div><script>

/* EDIT YOUR TEXT HERE */

const textBox1 = `nsfw,porn,18+,ome,fagata`

const textBox2 = `🎅╭ ・ ───・✦ ･ ✨ ･✦・──・╮
﹕🔞 》Najlepsze darmowe nagie zdjęcia
﹕😈 》 Ponad 100 filmów / treści publikowanych codziennie
﹕💋 》CODZIENNE NOWE MATERIAŁY
﹕🔒 》Nie wymaga weryfikacji ani żadnych danych!
﹕👅 》Best Premium NSFW
﹕╰――・₊💖Dołącz teraz 💦`

/* ================= */

document.getElementById("box1").innerText=textBox1
document.getElementById("box2").innerText=textBox2

function copyBlock(text){

navigator.clipboard.writeText(text)

}

document.getElementById("box1").onclick=function(){
copyBlock(textBox1)
}

document.getElementById("box2").onclick=function(){
copyBlock(textBox2)
}

let available=0
let done=0

function updateCounters(){

document.getElementById("availableCount").innerText=available+" tokens"
document.getElementById("doneCount").innerText=done+" tokens"

}

function addTokens(){

let lines=document.getElementById("input").value.split("\n")

lines.forEach(token=>{

token=token.trim()

if(token==="") return

let div=document.createElement("div")
div.className="token"
div.innerText=token

div.onclick=function(){

navigator.clipboard.writeText(token)

div.classList.add("done")

setTimeout(()=>{
document.getElementById("done").appendChild(div)
available--
done++
updateCounters()
},200)

}

document.getElementById("tokens").appendChild(div)

available++

})

document.getElementById("input").value=""

updateCounters()

}

updateCounters()

</script></body>
</html>
