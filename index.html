<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Token Manager</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'DM Sans',sans-serif;
background:#070707;
color:white;
padding:18px;
}

h1{
font-size:22px;
margin-bottom:15px;
text-align:center;
color:#00eaff;
text-shadow:0 0 15px #00eaff88;
}

textarea{
width:100%;
height:110px;
border-radius:14px;
border:1px solid #00eaff33;
background:#111;
color:white;
padding:14px;
font-size:14px;
outline:none;
box-shadow:0 0 20px #00eaff22 inset;
margin-bottom:10px;
}

button{
width:100%;
border:none;
border-radius:12px;
padding:12px;
font-weight:600;
background:#00eaff;
color:black;
margin-bottom:20px;
font-size:15px;
box-shadow:0 0 15px #00eaff;
transition:0.2s;
}

button:active{
transform:scale(.97);
}

.section{
margin-bottom:25px;
}

.section h2{
font-size:16px;
margin-bottom:10px;
color:#00eaff;
}

.counter{
font-size:12px;
opacity:.6;
margin-bottom:8px;
}

.token{
background:#101010;
border:1px solid #00eaff33;
border-radius:12px;
padding:12px;
margin-bottom:8px;
font-size:13px;
word-break:break-all;

transition:all .35s ease;
animation:fade .25s;
}

.token:hover{
box-shadow:0 0 10px #00eaff33;
}

.token.done{
border:1px solid #00ff9c55;
box-shadow:0 0 10px #00ff9c33;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(6px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style></head><body><h1>Token Manager</h1><textarea id="input" placeholder="paste tokens (one per line)"></textarea><button onclick="addTokens()">Add Tokens</button>

<div class="section">
<h2>Available</h2>
<div class="counter" id="availableCount"></div>
<div id="tokens"></div>
</div><div class="section">
<h2>Done</h2>
<div class="counter" id="doneCount"></div>
<div id="done"></div>
</div><script>

let available=0
let done=0

function updateCounters(){
document.getElementById("availableCount").innerText=available+" tokens"
document.getElementById("doneCount").innerText=done+" tokens"
}

function addTokens(){

let lines=document.getElementById("input").value.split("\n")

lines.forEach(token=>{

token=token.trim()

if(token==="") return

let div=document.createElement("div")
div.className="token"
div.innerText=token

div.onclick=function(){

navigator.clipboard.writeText(token)

div.classList.add("done")

setTimeout(()=>{
document.getElementById("done").appendChild(div)
available--
done++
updateCounters()
},200)

}

document.getElementById("tokens").appendChild(div)

available++

})

document.getElementById("input").value=""

updateCounters()

}

updateCounters()

</script></body>
</html>
