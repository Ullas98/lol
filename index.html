<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Token Manager</title>

<style>

body{
background:#0a0a0a;
font-family:Segoe UI;
color:white;
margin:0;
padding:40px;
}

h1{
text-align:center;
color:#00e5ff;
text-shadow:0 0 10px #00e5ff;
}

textarea{
width:100%;
height:120px;
background:#111;
border:1px solid #00e5ff55;
border-radius:10px;
color:white;
padding:15px;
font-size:14px;
outline:none;
box-shadow:0 0 15px #00e5ff22 inset;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.2s;
box-shadow:0 0 10px #00e5ff;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00e5ff;
}

.container{
display:flex;
gap:30px;
margin-top:30px;
}

.box{
flex:1;
background:rgba(255,255,255,0.03);
border:1px solid #00e5ff33;
border-radius:15px;
padding:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px #00e5ff22;
}

.box h2{
margin-top:0;
color:#00e5ff;
}

.token{
display:flex;
justify-content:space-between;
align-items:center;
background:#111;
margin:10px 0;
padding:12px;
border-radius:10px;
border:1px solid #00e5ff22;
transition:all .35s ease;
animation:fadeIn .3s;
}

.token:hover{
transform:translateY(-2px);
box-shadow:0 0 15px #00e5ff33;
}

.copyBtn{
background:#00e5ff;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.copyBtn:hover{
box-shadow:0 0 10px #00e5ff;
}

.done{
border:1px solid #00ff9c55;
box-shadow:0 0 10px #00ff9c33;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<h1>Token Manager</h1>

<textarea id="tokenInput" placeholder="paste tokens here (one per line)"></textarea>
<br>
<button onclick="addTokens()">Add Tokens</button>

<div class="container">

<div class="box">
<h2>Available</h2>
<div id="tokenList"></div>
</div>

<div class="box">
<h2>Done</h2>
<div id="doneList"></div>
</div>

</div>

<script>

function addTokens(){

let input=document.getElementById("tokenInput").value;

let tokens=input.split("\n");

tokens.forEach(token=>{
token=token.trim();

if(token!=""){
createToken(token);
}

});

document.getElementById("tokenInput").value="";

}

function createToken(token){

let div=document.createElement("div");
div.className="token";

let text=document.createElement("span");
text.innerText=token;

let btn=document.createElement("button");
btn.className="copyBtn";
btn.innerText="Copy";

btn.onclick=function(){

navigator.clipboard.writeText(token);

div.classList.add("done");

setTimeout(()=>{
document.getElementById("doneList").appendChild(div);
btn.remove();
},200);

}

div.appendChild(text);
div.appendChild(btn);

document.getElementById("tokenList").appendChild(div);

}

</script>

</body>
</html>
